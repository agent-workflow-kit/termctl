name: ci

# Thin caller for agent-workflow-kit/awkit-ci, plus a `tmux` matrix that runs the real-tmux tests
# on the tmux 3.2 floor and on the runner image's current tmux.
# Status checks: `ci / ci-ok` (required), `tmux (floor)` and `tmux (latest)`. The tmux checks are
# not part of `ci / ci-ok`; they gate merges only once they are added as required checks in
# branch protection (maintainer).
# Source: https://github.com/agent-workflow-kit/awkit-ci/tree/main/templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: agent-workflow-kit/awkit-ci/.github/workflows/python-ci.yml@v0.1.0

  # The shared verify job cannot install packages, so it runs the real-tmux tests only when the
  # runner image ships tmux. This matrix installs tmux from apt and sets TERMCTL_REQUIRE_TMUX, so
  # a missing tmux fails instead of skipping:
  # - floor: ubuntu-22.04 ships tmux 3.2a, the oldest supported version (design.md D16);
  #   `make verify-floor` checks that `tmux -V` reports 3.2 before running the tests. If GitHub
  #   retires that image, build tmux 3.2a from source here instead.
  # - latest: the current runner image's tmux, with the whole of `make verify`.
  tmux:
    name: tmux (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: floor
            os: ubuntu-22.04
            target: verify-floor
          - name: latest
            os: ubuntu-latest
            target: verify
    env:
      TERMCTL_REQUIRE_TMUX: "1"
      UV_PYTHON: "3.12"
      MAKE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V
      - name: uv sync
        run: uv sync --python "$UV_PYTHON"
      - name: make ${{ matrix.target }}
        run: make "$MAKE_TARGET"

  release:
    needs: [ci, tmux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The release pushes with the release GitHub App token, so GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    uses: agent-workflow-kit/awkit-ci/.github/workflows/release.yml@v0.1.0
    secrets:
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
